spring:
  application:
    name: tierra-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tierra?stringtype=unspecified}
    username: ${DB_USUARIO:tierra_app}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    # Sólo el esquema. Los datos de prueba viven en db/dev y se suman
    # únicamente con el perfil 'dev' activo (ver application-dev.yml).
    # El default es el comportamiento de producción: si alguien olvida
    # el perfil, la base queda sin datos de prueba — molesto pero inofensivo.
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      # Las tablas las crea Flyway (ver db/migration). 'validate' hace que la
      # aplicación no arranque si las entidades no coinciden con el esquema:
      # es la red de seguridad, no cambiarlo a 'update'.
      ddl-auto: validate

server:
  port: 8080
  servlet:
    session:
      # Siete días de inactividad. Un e-commerce que deslogea todos los días
      # vende menos, y como la cookie es httpOnly el riesgo de robo es bajo.
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        # httpOnly: ningún script del navegador puede leerla. Es la ventaja
        # concreta de la sesión en cookie sobre guardar un token en localStorage.
        http-only: true
        # Primera capa contra CSRF: el navegador no manda la cookie en
        # peticiones que vengan de otro sitio. La segunda es el token (ver
        # SecurityConfig).
        same-site: lax
        # En producción va en true: la cookie viaja sólo por HTTPS. En
        # desarrollo tiene que ser false porque localhost es HTTP.
        secure: ${SESSION_COOKIE_SECURE:false}

# Parámetros de autenticación. Son decisiones que pueden cambiar sin tocar
# código: el factor de costo de BCrypt se sube con los años, y el bloqueo
# por intentos es una política, no un detalle técnico.
auth:
  bcrypt-costo: ${BCRYPT_COSTO:12}
  intentos-maximos: ${LOGIN_INTENTOS_MAXIMOS:5}
  bloqueo-minutos: ${LOGIN_BLOQUEO_MINUTOS:15}

cors:
  # Lista separada por comas. Nunca comodín: con credenciales habilitadas la
  # especificación de CORS lo prohíbe y el navegador rechaza la respuesta.
  origenes-permitidos: ${CORS_ORIGENES:http://localhost:3000}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN}
  url-exito: ${MP_URL_EXITO:http://localhost:3000/checkout/exito}
  url-fallo: ${MP_URL_FALLO:http://localhost:3000/checkout/error}
  url-pendiente: ${MP_URL_PENDIENTE:http://localhost:3000/checkout/pendiente}
  # Clave secreta del webhook (distinta del access token). Se genera en el panel
  # de MP: Tus integraciones -> tu aplicacion -> Webhooks -> Configurar notificaciones.
  # Default vacio a proposito: sin ella, WebhookSignatureValidator rechaza (falla
  # cerrado) cualquier notificacion en vez de tumbar el arranque de toda la app,
  # porque este endpoint no hace falta para desarrollar el resto del sistema.
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  # true SOLO en el servidor que cobra de verdad: exige webhook secret, URLs
  # de retorno https y un token que no sea de prueba (la app no arranca si falta algo).
  produccion: ${MP_PRODUCCION:false}

# La password de la base y el access token de Mercado Pago NUNCA van hardcodeados
# acá: se leen de variables de entorno (DB_PASSWORD, MP_ACCESS_TOKEN). En desarrollo
# local se definen en un archivo .env que NO se sube al repositorio (ver .gitignore).
# Usar el access token de TEST (empieza con "TEST-") mientras se desarrolla.
