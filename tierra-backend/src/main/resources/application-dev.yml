# Perfil de desarrollo local. Se activa con SPRING_PROFILES_ACTIVE=dev
# (definido en el .env de la raíz del repo, que lee el launch.json de VS Code).
#
# Cambia dos cosas respecto del default:
# - Flyway también mira db/dev, donde vive el seed de datos de prueba. Sin
#   este perfil la base queda con el esquema creado pero sin datos.
# - Trae una clave fija para el HMAC de los códigos de acceso (abajo).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev

# Clave fija para el HMAC de los códigos de acceso. Es pública (está en el
# repo), así que fuera del perfil dev el backend se niega a arrancar con
# ella: ver CodigoAccesoConfig. Una variable CODIGO_ACCESO_CLAVE la reemplaza.
auth:
  codigo:
    clave-hmac: ${CODIGO_ACCESO_CLAVE:solo-desarrollo-clave-hmac-de-tierra-no-usar-en-produccion}
